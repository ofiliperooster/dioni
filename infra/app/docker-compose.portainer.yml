version: "3.8"

services:
  web:
    image: ghcr.io/ofiliperooster/dioni:latest
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    networks:
      - network_swarm_public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.dioni.rule=Host(`dioni.kernihost.com`)
        - traefik.http.routers.dioni.entrypoints=websecure
        - traefik.http.routers.dioni.tls=true
        - traefik.http.routers.dioni.tls.certresolver=letsencryptresolver
        - traefik.http.services.dioni.loadbalancer.server.port=3000

networks:
  network_swarm_public:
    external: true
